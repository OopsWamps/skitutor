{% extends "base.html" %}
{% block title %}出错了 · SKITUTOR{% endblock %}
{% block content %}
<div class="panel panel--solid">
  <h1>{{ '页面不存在' if status == 404 else '请求没有完成' }}<span class="sr-only">（{{ status }}）</span></h1>
  <p class="muted" style="overflow-wrap:anywhere">{{ detail }}</p>
  <p style="margin-top:20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <a class="btn" href="/" style="text-decoration:none">回到上传页</a>
    <a class="ghost-link" href="/tasks">任务列表</a>
  </p>
</div>
{% endblock %}
