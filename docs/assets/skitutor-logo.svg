<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -20 654 142" width="654" height="142" role="img" aria-label="SKITUTOR">
  <title>SKITUTOR</title>
        <defs>
          <linearGradient id="igBody" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#6bb4d6"/><stop offset=".26" stop-color="#a9dcf3"/>
            <stop offset=".52" stop-color="#e2f7ff"/><stop offset=".66" stop-color="#f7ffff"/>
            <stop offset=".84" stop-color="#93cde9"/><stop offset="1" stop-color="#5c9cbe"/>
          </linearGradient>
          <linearGradient id="igRed" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ff9a80"/><stop offset=".42" stop-color="#ee4a42"/>
            <stop offset="1" stop-color="#cf2130"/>
          </linearGradient>
          <linearGradient id="igShade" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset=".55" stop-color="#0d4566" stop-opacity="0"/>
            <stop offset="1" stop-color="#0d4566" stop-opacity=".34"/>
          </linearGradient>
          <linearGradient id="igSheen" x1="0" y1="0" x2="40" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
            <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="igSweep">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset=".5" stop-color="#ffffff" stop-opacity=".72"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="igPtr">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
          <pattern id="igDots" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
            <circle cx="2.1" cy="2.1" r="1.25" fill="rgba(10,58,90,.16)"/>
          </pattern>
          <!-- 手凿冰砖字母（歪斜与豁口已烘焙进坐标）；p*=字母，pk*=红色双板。
               clipPath 里的 use 只能引用单个 path（引用 g 会被 Chromium 裁成空），所以每个字形都是独立路径 -->
          <path id="pS" d="M-1.7 2.5L7.5 0.0L15.6 0.6L24.3 -0.4L27.0 5.1L29.5 -0.0L39.1 -1.6L51.4 -1.3L61.4 -1.2L61.4 7.2L62.9 18.5L51.8 19.2L41.7 19.1L30.1 19.7L18.6 21.0L18.4 26.0L22.2 31.6L19.0 28.3L19.8 40.0L29.6 39.6L42.3 38.5L51.3 37.9L62.6 38.0L64.3 51.2L64.2 61.9L64.7 73.8L66.7 86.3L66.1 97.6L54.6 99.5L41.9 98.9L28.4 101.5L15.8 102.1L2.1 102.5L0.9 91.5L0.7 82.3L13.2 82.3L24.6 81.7L34.7 81.3L45.9 79.0L46.3 69.0L43.9 58.6L33.4 59.1L23.8 61.7L10.7 60.0L0.6 61.1L0.1 50.6L-1.4 37.5L-0.2 25.5L-2.3 14.8Z"/>
